services:
  - type: web
    name: appointy-backend
    env: node
    plan: starter
    buildCommand: "npm --prefix backend install"
    startCommand: "npm --prefix backend run start"
    envVars:
      - key: MONGO_URI
        fromDatabase:
          type: external
          name: mongodb
      - key: JWT_SECRET
      - key: STRIPE_API_KEY
      - key: RAZORPAY_API_KEY
      - key: ADMIN_EMAIL
      - key: ADMIN_PASSWORD
    disk:
      size: 0
    healthcheckPath: "/test-db"
